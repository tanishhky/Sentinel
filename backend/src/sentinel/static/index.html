<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sentinel</title>
  <link rel="icon" href="/static/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ff9000" />
  <link rel="stylesheet" href="/static/theme.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<body>
  <div class="app">
    <header class="header">
      <span class="brand">▲ SENTINEL</span>
      <span class="muted mono">PINSIGHT · DRIFTEDGE</span>
      <span id="status-lights" style="margin-left:auto"></span>
      <span id="clock" class="muted mono"></span>
    </header>
    <div id="conn-banner" class="conn-banner" hidden>
      ⚠ CONNECTION LOST — SHOWING LAST DATA
    </div>

    <nav class="tabs" id="top-tabs"></nav>
    <nav class="subtabs" id="sub-tabs"></nav>
    <main class="content" id="content">
      <div class="muted">Loading…</div>
    </main>
  </div>

  <script src="/static/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>

</html>
